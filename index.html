<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4eee7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MOONI">
<link rel="manifest" href="./manifest.webmanifest">
<title>MOONI Camera</title>
<style>
:root{--bg:#050505;--ink:#f7f6f2;--muted:#aaa8a2;--line:#343330;--accent:#d8d4ca}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#050505;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
body{overscroll-behavior:none}
.app{width:100%;max-width:520px;min-height:100svh;margin:auto;padding:env(safe-area-inset-top) 15px calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;background:#050505}
header{height:40px;flex:0 0 40px;display:flex;align-items:center;justify-content:center;padding:0}
.logo{font:500 16px Georgia,serif;letter-spacing:.42em;padding-left:.42em;color:#f4f1e9}
.tag{display:none}
.stage{position:relative;flex:1 1 auto;width:100%;min-height:330px;max-height:calc(100svh - 275px);aspect-ratio:3/4;margin:auto 0 12px;overflow:hidden;border-radius:24px;background:#171614;box-shadow:0 8px 30px #0008;transition:width .18s,aspect-ratio .18s}
.live-frame{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);overflow:hidden;background:#000}
.live-frame video{width:100%;height:100%;object-fit:cover;display:block}
.live-frame video.selfie-preview{transform:scaleX(-1)}
.stage{transition:none}
.placeholder{position:absolute;inset:0;display:grid;place-content:center;text-align:center;color:#fff;font:16px/1.7 Georgia,serif;padding:25px}
.frame-guide{position:absolute;z-index:2;left:27%;top:24%;width:46%;height:52%;border:2px solid #fff;border-radius:22px;pointer-events:none;box-shadow:0 0 0 999px #00000008}
.frame-label{position:absolute;z-index:3;top:calc(24% - 26px);left:0;right:0;text-align:center;color:white;font-size:12px;font-weight:650;letter-spacing:.04em;text-shadow:0 1px 4px #0009;pointer-events:none}
.stage-meta{position:absolute;z-index:3;bottom:15px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:8px;pointer-events:auto}
.meta-chip{background:#161512b8;color:#fff;border:1px solid #ffffff1c;border-radius:30px;padding:9px 13px;font-size:11px;backdrop-filter:blur(12px)}
.toolbar{position:absolute;z-index:4;top:12px;left:12px;right:12px;display:flex;justify-content:flex-end}.zoom-control{display:flex;align-items:center;gap:2px;padding:4px;background:#171614b8;border:1px solid #ffffff35;border-radius:24px;backdrop-filter:blur(12px)}.zoom-control button{width:34px;height:30px;border:0;border-radius:18px;background:transparent;color:#fff;font-size:17px}.zoom-control button:disabled{opacity:.35}.zoom-control #zoomReset{width:42px;font-size:11px;font-weight:650}
.pill{border:1px solid #ffffff40;background:#17161480;color:white;border-radius:30px;padding:8px 12px;font-size:11px;backdrop-filter:blur(12px)}
.ratio-wrap{padding:7px 0 5px}
.ratio-label{font-size:8px;color:#77746e;letter-spacing:.18em;text-align:center;margin-bottom:7px}
.ratios{display:flex;justify-content:center;gap:3px;padding:3px;background:#191917;border:1px solid #35342f;border-radius:24px;width:min(100%,250px);margin:0 auto}
.ratio{flex:1;border:0;background:transparent;color:#99968f;border-radius:20px;padding:8px 13px;font-size:11px;letter-spacing:.02em}
.ratio[aria-pressed=true]{background:#f1efe8;color:#171613;font-weight:650;box-shadow:0 1px 4px #0005}.landscape-shot{display:block;margin:8px auto 0;padding:8px 15px;border:1px solid #555149;border-radius:22px;background:#191917;color:#e9e6df;font-size:9px;letter-spacing:.1em}.landscape-shot[aria-pressed=true]{background:#f1efe8;color:#171613}
.filters{display:flex;gap:9px;overflow-x:auto;padding:9px 1px 8px;scrollbar-width:none;scroll-snap-type:x proximity}
.filters::-webkit-scrollbar{display:none}
.filter{flex:0 0 57px;border:0;background:none;color:#85827b;font-size:8px;letter-spacing:.07em;padding:0;scroll-snap-align:start}
.swatch{height:36px;border-radius:9px;margin-bottom:5px;border:2px solid transparent;box-shadow:inset 0 0 0 1px #ffffff35}
.filter[aria-pressed=true]{color:#fff;font-weight:650}
.filter[aria-pressed=true] .swatch{border-color:#f1eee6}
.caption{text-align:center;font:italic 10px Georgia,serif;color:#918d85;padding:1px 0 4px;min-height:17px}
.controls{display:flex;align-items:center;justify-content:space-around;gap:12px;padding:5px 13px 8px}
.round{width:42px;height:42px;border-radius:50%;border:0;background:transparent;color:#f4f2ed;font-size:25px;display:grid;place-items:center}
.round[aria-pressed=true]{background:#35332e}.album-button{overflow:hidden;border:1px solid #77746d;background:#222;padding:3px}.album-button img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.shutter{width:78px;height:78px;border:2px solid #f5f4f0;border-radius:50%;background:transparent;display:grid;place-items:center;padding:0;flex:0 0 78px}
.shutter:after{content:"";width:65px;height:65px;border-radius:50%;background:#fff;border:1px solid #d8d6d0}
.status{text-align:center;color:#88857e;font-size:9px;min-height:15px;padding-top:1px;letter-spacing:.025em}
#result{display:none}
.gallery{display:none;position:fixed;z-index:20;inset:0;background:#080807;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 16px);overflow:auto}
.gallery.open{display:block}.gallery-head{display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:.2em;padding:6px 2px 18px}
.gallery-close{border:0;background:none;color:white;font-size:30px}.gallery-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.gallery-thumb{width:100%;aspect-ratio:1;object-fit:cover;border-radius:5px;background:#222}
.gallery-empty{color:#85827b;text-align:center;font:italic 14px Georgia,serif;padding:45px 10px}
.gallery-preview{display:none;text-align:center}.gallery-preview img{max-width:100%;max-height:72svh;object-fit:contain;border-radius:8px}
.gallery-actions{display:flex;gap:10px;justify-content:center;margin-top:14px}
.action{border:1px solid #45433d;border-radius:22px;background:#191815;color:#fff;padding:10px 17px;text-decoration:none;font-size:12px}
footer{display:none}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
@media(max-height:740px){header{height:30px;flex-basis:30px}.stage{max-height:calc(100svh - 240px);min-height:260px}.controls{padding-top:1px}.shutter{width:68px;height:68px;flex-basis:68px}.shutter:after{width:57px;height:57px}}

</style>
</head>
<body><div class="app">
<header><div class="logo">MOONI</div><div class="tag">little moments, softly remembered.</div></header>
<section class="stage">
<div class="live-frame" id="liveFrame"><video id="video" autoplay playsinline muted></video></div>
<div class="placeholder" id="placeholder">MOONI<br><small>Đang mở camera…</small></div><div class="stage-meta"><div class="zoom-control"><button id="zoomOut" aria-label="Thu nhỏ">−</button><button id="zoomReset" aria-label="Mức zoom hiện tại">1.0×</button><button id="zoomIn" aria-label="Phóng to">+</button></div></div>
</section>
<nav class="filters" aria-label="Bộ lọc màu">
<button class="filter" data-f="original" aria-pressed="true"><div class="swatch" style="background:linear-gradient(135deg,#c5c4b8,#eee5d9)"></div>ORIGINAL</button>
<button class="filter" data-f="coast" aria-pressed="false"><div class="swatch" style="background:linear-gradient(135deg,#168b9b,#c1d2bb)"></div>COAST</button>
<button class="filter" data-f="sunny" aria-pressed="false"><div class="swatch" style="background:linear-gradient(135deg,#b98558,#ead6ae)"></div>SUNNY</button>
<button class="filter" data-f="green" aria-pressed="false"><div class="swatch" style="background:linear-gradient(135deg,#304c36,#aab58b)"></div>GREEN</button>
<button class="filter" data-f="flash" aria-pressed="false"><div class="swatch" style="background:linear-gradient(135deg,#79583e,#e5c69c)"></div>FLASH</button>
<button class="filter" data-f="softfilm" aria-pressed="false"><div class="swatch" style="background:linear-gradient(135deg,#c2a990,#e9ddcc)"></div>SOFT FILM</button>
<button class="filter" data-f="clear" aria-pressed="false"><div class="swatch" style="background:linear-gradient(135deg,#d7d8ce,#9eb5ad)"></div>CLEAR</button>
<button class="filter" data-f="retro" aria-pressed="false"><div class="swatch" style="background:linear-gradient(135deg,#a97851,#e2c69c)"></div>RETRO</button>
<button class="filter" data-f="cool" aria-pressed="false"><div class="swatch" style="background:linear-gradient(135deg,#668b9e,#d2d8d7)"></div>COOL</button>
<button class="filter" data-f="peach" aria-pressed="false"><div class="swatch" style="background:linear-gradient(135deg,#d99c8c,#f0d4c4)"></div>PEACH</button>
<button class="filter" data-f="mono" aria-pressed="false"><div class="swatch" style="background:linear-gradient(135deg,#333,#d8d4ce)"></div>MONO</button>
<button class="filter" data-f="vivid" aria-pressed="false"><div class="swatch" style="background:linear-gradient(135deg,#177b80,#e5b77c)"></div>VIVID</button>
</nav>
<div class="ratio-wrap"><div class="ratio-label">ASPECT RATIO</div><div class="ratios" aria-label="Tỷ lệ ảnh">
 <button class="ratio" data-ratio="4:3" aria-pressed="true">4:3</button>
 <button class="ratio" data-ratio="16:9" aria-pressed="false">16:9</button>
 <button class="ratio" data-ratio="1:1" aria-pressed="false">1:1</button>
</div><button class="landscape-shot" id="landscapeShot" aria-pressed="false">↔ &nbsp; CHỤP NGANG · CAMERA TRƯỚC</button></div>
<div class="caption" id="caption">Màu gốc, giữ nguyên chất ảnh camera.</div>
<div class="controls"><button class="round album-button" id="last" aria-label="Mở album ảnh" title="Album ảnh"><img id="albumLatest" alt="" hidden></button><button class="round" id="filterToggle" aria-label="Hiện bộ lọc" title="Bộ lọc">▢</button><button class="round" id="timerToggle" aria-label="Hẹn giờ" title="Hẹn giờ">◷</button><button class="round" id="flashToggle" aria-label="Bật đèn flash" aria-pressed="false" title="Flash">ϟ</button><button class="round" id="flip2" aria-label="Đổi camera" title="Đổi camera">⟳</button></div><div class="controls" style="padding-top:0"><button class="shutter" id="capture" aria-label="Chụp ảnh"></button></div>
<div class="status" id="status">MOONI · bản thử nghiệm miễn phí</div>
<section id="gallery" class="gallery" aria-label="Thư viện ảnh">
 <div class="gallery-head"><span>THƯ VIỆN MOONI</span><button id="closeGallery" class="gallery-close" aria-label="Đóng thư viện">×</button></div>
 <div id="galleryGrid" class="gallery-grid"></div><div id="galleryEmpty" class="gallery-empty">Ảnh chụp sẽ tự động lưu ở đây.</div>
 <div id="galleryPreview" class="gallery-preview"><img id="galleryPhoto" alt="Ảnh trong thư viện"><div class="gallery-actions"><a id="galleryDownload" class="action" download="mooni-photo.jpg">Tải ảnh về iPhone</a><button id="galleryBack" class="action">Quay lại</button></div></div>
</section>
<footer>MADE OF LITTLE MOMENTS · MOONI</footer></div>
<canvas id="canvas" hidden></canvas>
<script>
const $=id=>document.getElementById(id), video=$('video'),canvas=$('canvas'),ctx=canvas.getContext('2d');
let stream=null,facing='environment',filter='original',lastUrl=null,zoom=1,nativeZoom=false,zoomCaps=null,ratio='4:3',landscapeMode=false,torchOn=false,torchSupported=false,timerSeconds=0,galleryItems=[];
const looks={
 original:{css:'none',grain:0,caption:'Màu gốc, giữ nguyên chất ảnh camera.'},
 coast:{css:'saturate(1.18) contrast(1.10) brightness(1.025) hue-rotate(-5deg)',grain:0,caption:'Biển xanh teal, trời trong và cây xanh sâu — nét, không grain.'},
 sunny:{css:'saturate(1.08) contrast(1.08) sepia(.10) brightness(1.025)',grain:0,caption:'Ánh nắng ấm, da tự nhiên và màu film compact.'},
 green:{css:'saturate(1.12) contrast(1.16) brightness(.985) hue-rotate(-4deg)',grain:0,caption:'Xanh lá trầm, bóng đổ sâu, giữ chi tiết.'},
 flash:{css:'saturate(1.02) contrast(1.20) brightness(1.015)',grain:0,caption:'Tương phản kiểu máy ảnh du lịch, không làm mịn da.'},
 softfilm:{css:'saturate(.94) contrast(1.02) sepia(.07) brightness(1.015)',grain:1.4,caption:'Màu film nhẹ cùng chút grain cực tinh tế.'},
 clear:{css:'saturate(1.02) contrast(1.07) brightness(1.035)',grain:0,caption:'Trong trẻo, sáng sạch và giữ chi tiết tự nhiên.'},
 retro:{css:'sepia(.18) saturate(1.16) contrast(1.12) brightness(1.01)',grain:0,caption:'Tông compact ấm, hoài niệm nhưng vẫn sắc nét.'},
 cool:{css:'saturate(.96) contrast(1.08) brightness(1.03) hue-rotate(7deg)',grain:0,caption:'Tông lạnh nhẹ, xanh trong và sạch.'},
 peach:{css:'sepia(.10) saturate(1.08) contrast(1.02) brightness(1.04) hue-rotate(-7deg)',grain:0,caption:'Hồng đào dịu, da ấm và sáng.'},
 mono:{css:'grayscale(1) contrast(1.12)',grain:0,caption:'Đen trắng có chiều sâu, giữ chi tiết.'},
 vivid:{css:'saturate(1.28) contrast(1.13) brightness(1.02)',grain:0,caption:'Màu nổi bật, xanh biển và cây lá rực rỡ.'}
};
function say(t){$('status').textContent=t}
async function setTorch(on){
 const track=stream?.getVideoTracks()[0];
 const caps=track?.getCapabilities?track.getCapabilities():{};
 torchSupported=!!caps.torch;
 if(!track||!torchSupported){torchOn=false;$('flashToggle').setAttribute('aria-pressed','false');say('iPhone/Safari hiện không hỗ trợ điều khiển đèn flash trong camera web.');return}
 try{
  await track.applyConstraints({advanced:[{torch:on}]});
  torchOn=on;$('flashToggle').setAttribute('aria-pressed',String(on));
  $('flashToggle').style.background=on?'#e8c98b':'#fff9';
  say(on?'Đèn flash đang bật':'Đèn flash đã tắt');
 }catch(e){torchOn=false;$('flashToggle').setAttribute('aria-pressed','false');say('Không bật được đèn flash trên camera này.')}
}
$('flashToggle').addEventListener('click',()=>setTorch(!torchOn));
$('filterToggle').addEventListener('click',()=>{const f=$('filterToggle');const nav=document.querySelector('.filters');nav.style.display=nav.style.display==='none'?'flex':'none';f.setAttribute('aria-pressed',String(nav.style.display==='none'));});
$('timerToggle').addEventListener('click',()=>{timerSeconds=timerSeconds===0?3:timerSeconds===3?10:0;$('timerToggle').textContent=timerSeconds?String(timerSeconds):'◷';$('timerToggle').setAttribute('aria-pressed',String(!!timerSeconds));say(timerSeconds?'Hẹn giờ '+timerSeconds+' giây':'Đã tắt hẹn giờ');});
function choose(name){filter=name;document.querySelectorAll('.filter').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.f===name)));video.style.filter=looks[name].css;$('caption').textContent=looks[name].caption}
document.querySelectorAll('.filter').forEach(b=>b.addEventListener('click',()=>choose(b.dataset.f)));
async function startCamera(){
 if(!navigator.mediaDevices?.getUserMedia){say('Camera cần trang HTTPS. Hãy mở bằng Safari trên iPhone.');return}
 say('Đang yêu cầu quyền camera…');
 try{
  if(stream)stream.getTracks().forEach(t=>t.stop());
  const request={audio:false,video:{
   facingMode:{ideal:facing},
   width:{ideal:3840},
   height:{ideal:2160},
   aspectRatio:{ideal:16/9},
   frameRate:{ideal:30,max:60}
  }};
  stream=await navigator.mediaDevices.getUserMedia(request);
  video.srcObject=stream;
  video.classList.toggle('selfie-preview',facing==='user');
  $('placeholder').style.display='none';
  video.play().catch(()=>{say('Camera đã kết nối. Chạm vào khung ảnh nếu chưa thấy hình.');});
  video.onloadedmetadata=()=>{
   $('placeholder').style.display='none';
   say((facing==='user'?'Camera trước':'Camera sau')+' · '+video.videoWidth+'×'+video.videoHeight+' · zoom 1×');
  };
  const track=stream.getVideoTracks()[0],caps=track.getCapabilities?track.getCapabilities():{};
  // Ask supported devices for continuous autofocus/exposure/white balance.
  const advanced=[];
  for(const key of ['focusMode','exposureMode','whiteBalanceMode']){
   if(caps[key]&&Array.isArray(caps[key])&&caps[key].includes('continuous'))advanced.push({[key]:'continuous'});
  }
  if(advanced.length){try{await track.applyConstraints({advanced})}catch(e){}}
  zoomCaps=caps.zoom||null;
  nativeZoom=!!(zoomCaps&&typeof zoomCaps.max==='number'&&zoomCaps.max>=1.5&&(zoomCaps.min||1)<=1.05);
  zoom=1;
  if(nativeZoom){try{await track.applyConstraints({advanced:[{zoom:Math.max(zoomCaps.min||1,1)}]})}catch(e){nativeZoom=false}}
  updateZoom();
  torchSupported=!!caps.torch;torchOn=false;
  $('flashToggle').setAttribute('aria-pressed','false');
  $('flashToggle').style.background='transparent';
  $('flashToggle').style.opacity=torchSupported?'1':'.55';
  $('flashToggle').title=torchSupported?'Bật/tắt đèn flash':'Thiết bị/trình duyệt không hỗ trợ đèn flash trong web camera';
 }catch(e){
  $('placeholder').innerHTML='MOONI<br><small>Không mở được camera. Kiểm tra quyền Camera trong Cài đặt iPhone → Safari.</small>';
  $('placeholder').style.display='grid';
  say('Lỗi camera: '+(e.name||'không xác định')+'. Hãy kiểm tra quyền truy cập.');
 }
}
function updateZoom(){
 const track=stream?.getVideoTracks()[0];
 if(nativeZoom&&track&&zoomCaps){const hardwareZoom=Math.min(zoomCaps.max,Math.max(zoomCaps.min||1,zoom));track.applyConstraints({advanced:[{zoom:hardwareZoom}]}).catch(()=>{nativeZoom=false;updateZoom()});}
 video.style.transform=(facing==='user'?'scaleX(-1) ':'')+(!nativeZoom&&zoom>1?'scale('+zoom+')':'');
 $('zoomReset').textContent=zoom.toFixed(1)+'×';
 $('zoomOut').disabled=zoom<=1;
 $('zoomIn').disabled=zoom>=3;
}
function updatePreviewFrame(){
 const stage=document.querySelector('.stage'),frame=$('liveFrame');
 const ratios={'4:3':3/4,'16:9':9/16,'1:1':1};
 const target=landscapeMode?16/9:(ratios[ratio]||3/4);
 const boxW=stage.clientWidth,boxH=stage.clientHeight;
 let w,h;
 if(boxW/boxH>target){h=boxH;w=h*target}else{w=boxW;h=w/target}
 frame.style.width=Math.round(w)+'px';frame.style.height=Math.round(h)+'px';
 $('landscapeShot').setAttribute('aria-pressed',String(landscapeMode));
}
function setRatio(value){
 ratio=value;landscapeMode=false;
 document.querySelectorAll('.ratio').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.ratio===value)));
 updatePreviewFrame();
}
document.querySelectorAll('.ratio').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.ratio===value)));
 const stage=document.querySelector('.stage'),frame=$('liveFrame');
 stage.dataset.ratio=value;
 const ratios={'4:3':3/4,'16:9':16/9,'1:1':1};
 const target=ratios[value]||3/4;
 const boxW=stage.clientWidth,boxH=stage.clientHeight;
 let w,h;
 if(boxW/boxH>target){h=boxH;w=h*target}else{w=boxW;h=w/target}
 frame.style.width=Math.round(w)+'px';frame.style.height=Math.round(h)+'px';
}
document.querySelectorAll('.ratio').forEach(b=>b.addEventListener('click',()=>setRatio(b.dataset.ratio)));
$('landscapeShot').addEventListener('click',async()=>{if(!landscapeMode){if(facing!=='user'){facing='user';await startCamera()}landscapeMode=true}else{landscapeMode=false}updatePreviewFrame();say(landscapeMode?'Chế độ chụp ngang · camera trước':'Đã trở về khung dọc')});

let pinchStart=0,pinchZoom=1;
const stageEl=document.querySelector('.stage');
stageEl.addEventListener('touchstart',e=>{if(e.touches.length===2){e.preventDefault();const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;pinchStart=Math.hypot(dx,dy);pinchZoom=zoom}},{passive:false});
stageEl.addEventListener('touchmove',e=>{if(e.touches.length===2&&pinchStart>0){e.preventDefault();const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;zoom=Math.max(1,Math.min(3,pinchZoom*Math.hypot(dx,dy)/pinchStart));zoom=Math.round(zoom*100)/100;updateZoom()}},{passive:false});
stageEl.addEventListener('touchend',e=>{if(e.touches.length<2)pinchStart=0},{passive:true});

function flip(){if(torchOn)setTorch(false);facing=facing==='environment'?'user':'environment';startCamera()}
$('flip2').onclick=flip;
$('zoomOut').onclick=()=>{zoom=Math.max(1,Math.round((zoom-.25)*100)/100);updateZoom()};
$('zoomIn').onclick=()=>{zoom=Math.min(3,Math.round((zoom+.25)*100)/100);updateZoom()};
$('zoomReset').onclick=()=>{zoom=1;updateZoom()};
$('capture').onclick=()=>{
 if(!stream||!video.videoWidth){say('Hãy bật camera trước nhé.');return}
 if(timerSeconds){const wait=timerSeconds;timerSeconds=0;$('timerToggle').textContent='◷';$('timerToggle').setAttribute('aria-pressed','false');let left=wait;say('Sẽ chụp sau '+left+' giây');const tick=()=>{left--;if(left>0){say('Còn '+left+' giây…');setTimeout(tick,1000)}else captureNow()};setTimeout(tick,1000);return}
 captureNow();
};
function captureNow(){
 if(!stream||!video.videoWidth)return;
 const vw=video.videoWidth,vh=video.videoHeight;
 // Use the full camera frame, crop only to the chosen output ratio.
 const ratios={'4:3':3/4,'16:9':9/16,'1:1':1};
 const target=landscapeMode?16/9:(ratios[ratio]||3/4);let sx=0,sy=0,sw=vw,sh=vh;
 if(sw/sh>target){sw=sh*target;sx=(vw-sw)/2}else{sh=sw/target;sy=(vh-sh)/2}
 // Match the live digital zoom by cropping the captured frame.

async function openGalleryItem(item){
 const url=URL.createObjectURL(item.blob);$('galleryPhoto').src=url;$('galleryDownload').href=url;$('galleryDownload').download='mooni-'+item.id+'.jpg';
 $('galleryGrid').style.display='none';$('galleryEmpty').style.display='none';$('galleryPreview').style.display='block';
}
function openGalleryDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open('mooni-gallery',1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('photos'))req.result.createObjectStore('photos',{keyPath:'id'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function saveGalleryItem(item){const db=await openGalleryDB();await new Promise((resolve,reject)=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').put(item);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});db.close()}
async function refreshGallery(){const db=await openGalleryDB();const items=await new Promise((resolve,reject)=>{const req=db.transaction('photos','readonly').objectStore('photos').getAll();req.onsuccess=()=>resolve(req.result.sort((a,b)=>b.id-a.id));req.onerror=()=>reject(req.error)});db.close();galleryItems=items;const latest=$('albumLatest');if(items.length){latest.src=URL.createObjectURL(items[0].blob);latest.hidden=false}else{latest.hidden=true}const grid=$('galleryGrid');grid.innerHTML='';items.forEach(item=>{const img=document.createElement('img');img.className='gallery-thumb';img.src=URL.createObjectURL(item.blob);img.alt='Ảnh MOONI';img.onclick=()=>openGalleryItem(item);grid.appendChild(img)});$('galleryEmpty').style.display=items.length?'none':'block';grid.style.display=items.length?'grid':'none'}
