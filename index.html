<style>
:root{--bg:#050505;--ink:#f7f6f2;--muted:#aaa8a2;--line:#343330;--accent:#d8d4ca}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#050505;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
body{overscroll-behavior:none}
.app{width:100%;max-width:520px;height:100vh;height:100dvh;min-height:0;margin:auto;padding:env(safe-area-inset-top) 15px calc(8px + env(safe-area-inset-bottom));display:flex;flex-direction:column;background:#050505;overflow:hidden}
header{height:34px;flex:0 0 34px;display:flex;align-items:center;justify-content:center;padding:0}
.logo{font:500 16px Georgia,serif;letter-spacing:.42em;padding-left:.42em;color:#f4f1e9}
.tag{display:none}
.stage{position:relative;flex:1 1 0;width:100%;min-height:0;max-height:none;aspect-ratio:auto;margin:0 0 5px;overflow:hidden;border-radius:24px;background:#171614;box-shadow:0 8px 30px #0008;transition:width .18s,aspect-ratio .18s}
.live-frame{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);overflow:hidden;background:#000}
.live-frame video{width:100%;height:100%;object-fit:cover;display:block}
.live-frame video.selfie-preview{transform:scaleX(-1)}
.stage{transition:none}
.placeholder{position:absolute;inset:0;display:grid;place-content:center;text-align:center;color:#fff;font:16px/1.7 Georgia,serif;padding:25px}
.frame-guide{position:absolute;z-index:2;left:27%;top:24%;width:46%;height:52%;border:2px solid #fff;border-radius:22px;pointer-events:none;box-shadow:0 0 0 999px #00000008}
.frame-label{position:absolute;z-index:3;top:calc(24% - 26px);left:0;right:0;text-align:center;color:white;font-size:12px;font-weight:650;letter-spacing:.04em;text-shadow:0 1px 4px #0009;pointer-events:none}
.exposure-ui #exposureSlider{position:absolute;left:50%;top:50%;width:42px;height:112px;transform:translate(-50%,-50%);border-radius:22px;background:transparent;touch-action:none;cursor:ns-resize;z-index:6;outline:none;pointer-events:auto}.exposure-ui #exposureSlider:focus-visible{outline:1px solid #fff;outline-offset:8px}.exposure-ui span:last-child{font-size:9px;font-variant-numeric:tabular-nums}.focus-ring{position:absolute;z-index:4;width:46px;height:46px;border:1.5px solid #fff;border-radius:50%;display:none;pointer-events:none;transform:translate(-50%,-50%);box-shadow:0 0 0 1px #0005}.stage-meta{position:absolute;z-index:3;bottom:15px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:8px;pointer-events:auto}
.meta-chip{background:#161512b8;color:#fff;border:1px solid #ffffff1c;border-radius:30px;padding:9px 13px;font-size:11px;backdrop-filter:blur(12px)}
.toolbar{position:absolute;z-index:4;top:12px;left:12px;right:12px;display:flex;justify-content:flex-end}.zoom-control{display:flex;align-items:center;gap:2px;padding:4px;background:#171614b8;border:1px solid #ffffff35;border-radius:24px;backdrop-filter:blur(12px)}.zoom-control button{width:34px;height:30px;border:0;border-radius:18px;background:transparent;color:#fff;font-size:17px}.zoom-control button:disabled{opacity:.35}.zoom-control #zoomReset{width:42px;font-size:11px;font-weight:650}
.pill{border:1px solid #ffffff40;background:#17161480;color:white;border-radius:30px;padding:8px 12px;font-size:11px;backdrop-filter:blur(12px)}
.ratio-wrap{flex:0 0 auto;padding:3px 0 2px}
.ratio-label{font-size:7px;color:#77746e;letter-spacing:.18em;text-align:center;margin-bottom:7px}
.ratios{display:flex;justify-content:center;gap:3px;padding:3px;background:#191917;border:1px solid #35342f;border-radius:24px;width:min(100%,250px);margin:0 auto}
.ratio{flex:1;border:0;background:transparent;color:#99968f;border-radius:20px;padding:6px 11px;font-size:11px;letter-spacing:.02em}
.ratio[aria-pressed=true]{background:#f1efe8;color:#171613;font-weight:650;box-shadow:0 1px 4px #0005}.landscape-shot{display:block;margin:5px auto 0;padding:6px 12px;border:1px solid #555149;border-radius:22px;background:#191917;color:#e9e6df;font-size:9px;letter-spacing:.1em}.landscape-shot[aria-pressed=true]{background:#f1efe8;color:#171613}
.filters{display:flex;flex:0 0 auto;gap:8px;overflow-x:auto;padding:3px 1px 3px;scrollbar-width:none;scroll-snap-type:x proximity}
.filters::-webkit-scrollbar{display:none}
.filter{flex:0 0 57px;border:0;background:none;color:#85827b;font-size:8px;letter-spacing:.07em;padding:0;scroll-snap-align:start}
.swatch{height:32px;border-radius:9px;margin-bottom:5px;border:2px solid transparent;box-shadow:inset 0 0 0 1px #ffffff35}
.filter[aria-pressed=true]{color:#fff;font-weight:650}
.filter[aria-pressed=true] .swatch{border-color:#f1eee6}
.caption{text-align:center;font:italic 9px Georgia,serif;color:#918d85;padding:1px 0 2px;min-height:13px;flex:0 0 auto}
.controls{display:flex;flex:0 0 auto;align-items:center;justify-content:space-around;gap:8px;padding:3px 10px 4px}
.round{width:38px;height:38px;border-radius:50%;border:0;background:transparent;color:#f4f2ed;font-size:25px;display:grid;place-items:center}
.round[aria-pressed=true]{background:#35332e}.album-button{overflow:hidden;border:1px solid #77746d;background:#222;padding:3px}.album-button img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.shutter{width:66px;height:66px;border:2px solid #f5f4f0;border-radius:50%;background:transparent;display:grid;place-items:center;padding:0;flex:0 0 66px}
.shutter:after{content:"";width:55px;height:55px;border-radius:50%;background:#fff;border:1px solid #d8d6d0}
.status{text-align:center;color:#88857e;font-size:8px;min-height:11px;flex:0 0 11px;padding-top:0;letter-spacing:.025em}
#result{display:none}
.gallery{display:none;position:fixed;z-index:20;inset:0;background:#080807;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 16px);overflow:auto}
.gallery.open{display:block}.gallery-head{display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:.2em;padding:6px 2px 18px}
.gallery-close{border:0;background:none;color:white;font-size:30px}.gallery-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.gallery-thumb{width:100%;aspect-ratio:1;object-fit:cover;border-radius:5px;background:#222}
.gallery-empty{color:#85827b;text-align:center;font:italic 14px Georgia,serif;padding:45px 10px}
.gallery-preview{display:none;text-align:center}.gallery-preview img{max-width:100%;max-height:68svh;object-fit:contain;border-radius:8px;touch-action:pan-y}.gallery-nav{display:flex;align-items:center;justify-content:center;gap:22px;margin:12px 0 4px}.gallery-nav button{width:42px;height:36px;border:1px solid #45433d;border-radius:20px;background:#191815;color:#fff;font-size:20px}.gallery-count{font-size:11px;color:#aaa8a2;min-width:60px}.delete-action{border-color:#754343;color:#f0aaaa}
.gallery-actions{display:flex;gap:10px;justify-content:center;margin-top:14px}
.action{border:1px solid #45433d;border-radius:22px;background:#191815;color:#fff;padding:10px 17px;text-decoration:none;font-size:12px}
footer{display:none}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
@media(max-height:740px){header{height:27px;flex-basis:27px}.stage{min-height:0;margin:2px 0 5px}.filters{gap:6px;padding:3px 1px}.filter{flex-basis:52px;font-size:7px}.swatch{height:27px}.ratio-wrap{padding:2px 0}.ratio{padding:5px 8px}.landscape-shot{margin:3px auto 0;padding:5px 10px;font-size:8px}.caption{min-height:11px;font-size:8px}.round{width:34px;height:34px;font-size:22px}.controls{padding:2px 8px}.shutter{width:58px;height:58px;flex-basis:58px}.shutter:after{width:48px;height:48px}.status{font-size:7px;min-height:9px;flex-basis:9px}}

</style>

  }catch(e){say('Không lưu được ảnh vào thư viện. Kiểm tra dung lượng iPhone nhé.')}
 },'image/jpeg',1)
};
$('last').onclick=async()=>{await refreshGallery();$('gallery').classList.add('open')};
$('closeGallery').onclick=async()=>{$('gallery').classList.remove('open');$('galleryPreview').style.display='none';$('galleryGrid').style.display='grid';if(galleryViewUrl){URL.revokeObjectURL(galleryViewUrl);galleryViewUrl=null}await startCamera();};
$('galleryBack').onclick=()=>{$('galleryPreview').style.display='none';$('galleryGrid').style.display='grid';if(galleryViewUrl){URL.revokeObjectURL(galleryViewUrl);galleryViewUrl=null}};
async function openGalleryItem(item){
 galleryIndex=galleryItems.findIndex(x=>x.id===item.id);
 if(galleryIndex<0)galleryIndex=0;
 showGalleryPhoto();
}
function showGalleryPhoto(){
 if(!galleryItems.length)return;
 galleryIndex=(galleryIndex+galleryItems.length)%galleryItems.length;
 const item=galleryItems[galleryIndex];
 if(galleryViewUrl)URL.revokeObjectURL(galleryViewUrl);
 galleryViewUrl=URL.createObjectURL(item.blob);
 $('galleryPhoto').src=galleryViewUrl;
 $('galleryDownload').href=galleryViewUrl;
 $('galleryDownload').download='mooni-'+item.id+'.jpg';
 $('galleryCount').textContent=(galleryIndex+1)+' / '+galleryItems.length;
 $('galleryPrev').disabled=galleryItems.length<2;
 $('galleryNext').disabled=galleryItems.length<2;
 $('galleryGrid').style.display='none';$('galleryEmpty').style.display='none';$('galleryPreview').style.display='block';
}
function stepGallery(delta){if(galleryItems.length>1){galleryIndex=(galleryIndex+delta+galleryItems.length)%galleryItems.length;showGalleryPhoto()}}
$('galleryPrev').onclick=()=>stepGallery(-1);
$('galleryNext').onclick=()=>stepGallery(1);
let galleryTouchX=0;
$('galleryPhoto').addEventListener('touchstart',e=>{galleryTouchX=e.touches[0].clientX},{passive:true});
$('galleryPhoto').addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-galleryTouchX;if(Math.abs(dx)>45)stepGallery(dx<0?1:-1)},{passive:true});

function openGalleryDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open('mooni-gallery',1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('photos'))req.result.createObjectStore('photos',{keyPath:'id'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function saveGalleryItem(item){const db=await openGalleryDB();await new Promise((resolve,reject)=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').put(item);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});db.close()}
async function deleteGalleryItem(id){
 const db=await openGalleryDB();
 await new Promise((resolve,reject)=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').delete(id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});
 db.close();
}
$('deletePhoto').onclick=async()=>{
 const item=galleryItems[galleryIndex];
 if(!item)return;
 if(!confirm('Xóa ảnh này khỏi thư viện MOONI?'))return;
 try{
  await deleteGalleryItem(item.id);
  if(galleryViewUrl){URL.revokeObjectURL(galleryViewUrl);galleryViewUrl=null}
  await refreshGallery();
  if(galleryItems.length){galleryIndex=Math.min(galleryIndex,galleryItems.length-1);showGalleryPhoto()}
  else{$('galleryPreview').style.display='none';$('galleryGrid').style.display='none';$('galleryEmpty').style.display='block'}
  say('Đã xóa ảnh khỏi thư viện MOONI');
 }catch(e){say('Không xóa được ảnh. Thử lại nhé.')}
};
async function refreshGallery(){const db=await openGalleryDB();const items=await new Promise((resolve,reject)=>{const req=db.transaction('photos','readonly').objectStore('photos').getAll();req.onsuccess=()=>resolve(req.result.sort((a,b)=>b.id-a.id));req.onerror=()=>reject(req.error)});db.close();galleryItems=items;const latest=$('albumLatest');if(items.length){latest.src=URL.createObjectURL(items[0].blob);latest.hidden=false}else{latest.hidden=true}const grid=$('galleryGrid');grid.innerHTML='';items.forEach(item=>{const img=document.createElement('img');img.className='gallery-thumb';img.src=URL.createObjectURL(item.blob);img.alt='Ảnh MOONI';img.onclick=()=>openGalleryItem(item);grid.appendChild(img)});$('galleryEmpty').style.display=items.length?'none':'block';grid.style.display=items.length?'grid':'none'}
setRatio('4:3');
window.addEventListener('resize',()=>updatePreviewFrame());
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js?v=mooni-v74',{updateViaCache:'none'}).then(reg=>reg.update()).catch(()=>{});
 // Request camera as soon as the app opens. Safari still asks the user to grant permission.
 startCamera();
</script></body></html>
